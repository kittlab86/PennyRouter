# Server deployment: pull-only, never builds. Deployed by
# scripts/deploy.sh (or `make deploy`), which copies this single file as
# compose.yaml plus a generated `.env` to the server, then pulls and
# restarts (plain `docker compose` finds compose.yaml automatically):
#   docker compose pull
#   docker compose up -d
# The image comes from GitHub Packages (ghcr.io), pushed by CI on every
# merge to main. No `build:` section on purpose (CI-guarded).
# Gateway only: catalog-sync deploys separately (see docs/architecture.md).
# The catalog artifact still arrives here: the separate catalog-sync
# ships versioned DB files into the shared catalog-data volume, which
# the gateway mounts read-only and picks up via reload. An empty volume
# means standby passthrough until the first artifact lands.
services:
  gateway:
    image: ${IMAGE:-ghcr.io/lsk242/pennyrouter:latest}
    container_name: gateway
    ports:
      - "${HOST_PORT:-3000}:${PORT:-8080}"
    environment:
      PORT: ${PORT:-8080}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api}
      MODAL_BASE_URL: ${MODAL_BASE_URL:-}
      BASETEN_BASE_URL: ${BASETEN_BASE_URL:-https://inference.baseten.co}
      GATEWAY_UI: ${GATEWAY_UI:-}
      CATALOG_DB: ${CATALOG_DB:-/catalog}
      UPSTREAM_MAX_CONCURRENT: ${UPSTREAM_MAX_CONCURRENT:-64}
      UPSTREAM_MAX_QUEUED: ${UPSTREAM_MAX_QUEUED:-128}
      RELOAD_INTERVAL_SECS: ${RELOAD_INTERVAL_SECS:-60}
      ALLOW_MANAGEMENT_PROXY: ${ALLOW_MANAGEMENT_PROXY:-}
      CLASSIFIER_MODEL: ${CLASSIFIER_MODEL:-}
      CLASSIFIER_BASE_URL: ${CLASSIFIER_BASE_URL:-}
      CLASSIFIER_TIMEOUT_MS: ${CLASSIFIER_TIMEOUT_MS:-8000}
      CLASSIFIER_FALLBACK_TIER: ${CLASSIFIER_FALLBACK_TIER:-low}
      CLASSIFIER_MAX_TOKENS: ${CLASSIFIER_MAX_TOKENS:-64}
      CLASSIFIER_MAX_INPUT_CHARS: ${CLASSIFIER_MAX_INPUT_CHARS:-32000}
    volumes:
      - catalog-data:/catalog:ro
    restart: unless-stopped

volumes:
  catalog-data:
