<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PennyRouter gateway · debug UI</title>
<script>document.documentElement.classList.add('js');</script>
<style>
  :root {
    --ink: #1f2733;
    --muted: #5c6675;
    --line: #e4e8ef;
    --wash: #f6f8fa;
    --ok: #177245;
    --ok-bg: #e5f3eb;
    --link: #0b5cad;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #fff;
    color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.5;
  }
  a { color: var(--link); }
  code, .mono {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.875em;
  }
  header.top { background: var(--wash); border-bottom: 1px solid var(--line); }
  .wrap { max-width: 88rem; margin: 0 auto; padding: 0 1.5rem; }
  .brand { display: flex; align-items: baseline; gap: 0.75rem; flex-wrap: wrap; padding: 1.2rem 0 0.8rem; }
  .brand h1 { font-size: 1.3rem; margin: 0; font-weight: 650; letter-spacing: -0.01em; }
  .brand h1 span { color: var(--muted); font-weight: 400; }
  .brand .spacer { flex: 1; }
  .brand .home { font-size: 0.9rem; }
  nav.tabs { display: flex; gap: 0.25rem; flex-wrap: wrap; padding-bottom: 0; }
  nav.tabs button {
    appearance: none; border: 0; background: transparent; cursor: pointer;
    font: inherit; font-size: 0.92rem; color: var(--muted);
    padding: 0.55rem 0.85rem 0.6rem; border-bottom: 2px solid transparent;
  }
  nav.tabs button:hover { color: var(--ink); background: #eceff3; }
  nav.tabs button[aria-selected="true"] { color: var(--ink); font-weight: 650; border-bottom-color: var(--ink); }
  main .wrap { padding-top: 1.5rem; padding-bottom: 3rem; }
  html.js .tab-panel { display: none; }
  html.js .tab-panel.active { display: block; }
  .tab-panel h2 { font-size: 1.05rem; margin: 0 0 0.6rem; font-weight: 650; }
  .tab-panel h3 { font-size: 0.95rem; margin: 1.4rem 0 0.4rem; font-weight: 650; }
  .tab-panel h4 { font-size: 0.9rem; margin: 1.1rem 0 0.3rem; font-weight: 600; }
  .tab-panel p { max-width: 70rem; }
  .tab-panel ul { padding-left: 1.4rem; }
  .table-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; margin: 0.6rem 0; }
  table { border-collapse: collapse; width: 100%; font-size: 0.85rem; }
  th, td { text-align: left; padding: 0.4rem 0.6rem; vertical-align: top; white-space: nowrap; }
  thead th, tbody tr:first-child th {
    background: var(--wash); color: var(--muted); font-weight: 600; font-size: 0.76rem;
    border-bottom: 1px solid var(--line);
  }
  tbody tr + tr td, tbody tr + tr th { border-top: 1px solid var(--line); }
  .bare-table { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin: 0.6rem 0; width: fit-content; max-width: 100%; }
  pre {
    background: var(--wash); border: 1px solid var(--line); border-radius: 10px;
    padding: 1rem; overflow: auto; font-size: 0.8rem; max-width: 70rem;
  }
  input[type="text"], input[type="password"], input:not([type]) {
    font: inherit; font-size: 0.9rem; padding: 0.35rem 0.5rem;
    border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--ink);
  }
  button.action {
    font: inherit; font-size: 0.9rem; cursor: pointer;
    padding: 0.35rem 0.8rem; border: 1px solid var(--line); border-radius: 6px;
    background: var(--wash); color: var(--ink);
  }
  button.action:hover { background: #eceff3; }
  label { white-space: nowrap; }
  #inspector-hash { color: var(--muted); font-size: 0.85rem; }
</style>
</head>
<body>
<header class="top">
  <div class="wrap brand">
    <h1>PennyRouter <span>gateway · debug UI</span></h1>
    <div class="spacer"></div>
    <a class="home" href="/">Home</a>
  </div>
  <nav class="wrap tabs" role="tablist" aria-label="Debug UI sections">
    <button role="tab" id="tabbtn-overview" aria-controls="tab-overview" aria-selected="true" data-tab="overview">Overview</button>
    <button role="tab" id="tabbtn-models" aria-controls="tab-models" aria-selected="false" data-tab="models">Models</button>
    <button role="tab" id="tabbtn-inspector" aria-controls="tab-inspector" aria-selected="false" data-tab="inspector">Inspector</button>
    <button role="tab" id="tabbtn-classifier" aria-controls="tab-classifier" aria-selected="false" data-tab="classifier">Classifier</button>
    <button role="tab" id="tabbtn-metrics" aria-controls="tab-metrics" aria-selected="false" data-tab="metrics">Metrics</button>
  </nav>
</header>
<main>
  <div class="wrap">
    <section class="tab-panel active" id="tab-overview" role="tabpanel" aria-labelledby="tabbtn-overview" tabindex="0">
      <h2>Overview</h2>
{{overview}}
    </section>
    <section class="tab-panel" id="tab-models" role="tabpanel" aria-labelledby="tabbtn-models" tabindex="0">
      <h2>Models</h2>
{{models}}
    </section>
    <section class="tab-panel" id="tab-inspector" role="tabpanel" aria-labelledby="tabbtn-inspector" tabindex="0">
      <h2>Routing inspector</h2>
{{inspector}}
    </section>
    <section class="tab-panel" id="tab-classifier" role="tabpanel" aria-labelledby="tabbtn-classifier" tabindex="0">
      <h2>Smart classifier</h2>
{{classifier}}
    </section>
    <section class="tab-panel" id="tab-metrics" role="tabpanel" aria-labelledby="tabbtn-metrics" tabindex="0">
      <h2>Metrics</h2>
{{metrics}}
    </section>
  </div>
</main>
<script>
(function(){
function activate(name){
var btns=document.querySelectorAll('[role="tab"]');
for(var i=0;i<btns.length;i++){
var on=btns[i].getAttribute('data-tab')===name;
btns[i].setAttribute('aria-selected',on?'true':'false');
var panel=document.getElementById('tab-'+btns[i].getAttribute('data-tab'));
if(panel){if(on){panel.classList.add('active');}else{panel.classList.remove('active');}}
}
try{history.replaceState(null,'','#'+name);}catch(e){/* hash stays stale; tab still switched */}
}
var btns=document.querySelectorAll('[role="tab"]');
for(var i=0;i<btns.length;i++){(function(b){
b.addEventListener('click',function(){activate(b.getAttribute('data-tab'));});
})(btns[i]);}
var start=location.hash.replace('#','');
if(start&&document.getElementById('tab-'+start)){activate(start);}
})();
</script>
</body>
</html>
