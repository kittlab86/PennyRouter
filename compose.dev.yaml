# Server stack: gateway + catalog-sync + catalog-ui, pull-only, never
# builds. Served behind a reverse proxy (Nginx Proxy Manager): no
# published ports anywhere — gateway and catalog-ui join the
# front-proxy network and expose 8080 there (proxy hosts reach
# gateway:8080 and catalog-ui:8080; stable container names). The
# network must already exist on the host (it belongs to the proxy
# stack). Deployed by scripts/deploy.sh (scp + pull) or as a git
# stack (compose file path = compose.dev.yaml).
# Config splits two ways: generic values load from the repo's
# `.env.dev` via `env_file:` (shipped beside compose.yaml by the scp
# deploy, present from git on git-stack hosts); secrets + custom URLs
# come from `environment:` interpolation (shipped merged `.env` on
# scp, stack environment on git-stack hosts — `environment:` wins
# over `env_file:` on conflicts).
# Container port is 8080 everywhere (`expose` is static): PORT in
# .env.dev must stay 8080 — the gateway listens on $PORT.
services:
  gateway:
    image: ${IMAGE:-ghcr.io/lsk242/pennyrouter:latest}
    container_name: gateway
    expose:
      - "8080"
    env_file:
      - .env.dev
    environment:
      # Secrets + custom URLs only (generic config arrives via
      # env_file above). Interpolated from the project env: the
      # shipped merged .env on scp deploys, the stack-manager
      # environment on git deploys.
      MODAL_BASE_URL: ${MODAL_BASE_URL:-}
      MODAL_MODELS: ${MODAL_MODELS:-}
      BASETEN_MODELS: ${BASETEN_MODELS:-}
    volumes:
      - catalog-data:/catalog:ro
    networks:
      - proxy
    restart: unless-stopped
  catalog-sync:
    image: ${CATALOG_IMAGE:-ghcr.io/lsk242/pennyrouter-catalog:latest}
    volumes:
      - catalog-data:/catalog
    env_file:
      - .env.dev
    environment:
      # Secrets only (generic config arrives via env_file above):
      # judge backends + popularity-pins Data API key.
      BASETEN_API_KEY: ${BASETEN_API_KEY:-}
      MODAL_KEY_ID: ${MODAL_KEY_ID:-}
      MODAL_KEY_SECRET: ${MODAL_KEY_SECRET:-}
      MODAL_JUDGE_URL: ${MODAL_JUDGE_URL:-}
      RANKINGS_API_KEY: ${RANKINGS_API_KEY:-}
    restart: unless-stopped
  # Read-only artifact browser: no published ports — it joins the
  # front-proxy network so Nginx Proxy Manager reaches it at
  # catalog-ui:8080. Create that proxy host in the NPM UI (port 81),
  # plus one for the gateway at gateway:8080.
  catalog-ui:
    image: ${CATALOG_IMAGE:-ghcr.io/lsk242/pennyrouter-catalog:latest}
    container_name: catalog-ui
    command: ["catalog-ui", "--dir", "/catalog", "--bind", "0.0.0.0"]
    expose:
      - "8080"
    volumes:
      - catalog-data:/catalog:ro
    environment:
      CATALOG_UI: "1"
      PORT: "8080"
    networks:
      - proxy
    restart: unless-stopped

volumes:
  catalog-data:

networks:
  proxy:
    name: ${PROXY_NETWORK:-nginx-proxy_default}
    external: true
