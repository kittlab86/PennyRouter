# Dev deployment: both services, pull-only, never builds. Deployed by
# scripts/deploy.sh like prod but with this file, its own directory,
# and its own host port (defaults: prod 3000, dev 8003):
#   COMPOSE_FILE=compose.dev.yaml DEPLOY_DIR=/opt/stacks/pennyrouter-dev \
#     HOST_PORT=8003 ./scripts/deploy.sh
# Both images come from GitHub Packages (ghcr.io), pushed by CI on every
# merge to main. No `build:` section on purpose (CI-guarded). The
# catalog-sync image carries its fixture input baked in, so no checkout
# is needed on the server; it writes versioned DB artifacts to the
# shared catalog-data volume, which the gateway mounts read-only.
services:
  gateway:
    image: ${IMAGE:-ghcr.io/lsk242/pennyrouter:latest}
    container_name: gateway
    ports:
      - "${HOST_PORT:-8003}:${PORT:-3000}"
    environment:
      PORT: ${PORT:-3000}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api}
      MODAL_BASE_URL: ${MODAL_BASE_URL:-}
      BASETEN_BASE_URL: ${BASETEN_BASE_URL:-https://inference.baseten.co}
      GATEWAY_UI: ${GATEWAY_UI:-}
      CATALOG_DB: /catalog
      UPSTREAM_MAX_CONCURRENT: ${UPSTREAM_MAX_CONCURRENT:-64}
      UPSTREAM_MAX_QUEUED: ${UPSTREAM_MAX_QUEUED:-128}
      RELOAD_INTERVAL_SECS: ${RELOAD_INTERVAL_SECS:-60}
      ALLOW_MANAGEMENT_PROXY: ${ALLOW_MANAGEMENT_PROXY:-}
      CLASSIFIER_MODEL: ${CLASSIFIER_MODEL:-}
      CLASSIFIER_BASE_URL: ${CLASSIFIER_BASE_URL:-}
      CLASSIFIER_TIMEOUT_MS: ${CLASSIFIER_TIMEOUT_MS:-8000}
      CLASSIFIER_FALLBACK_TIER: ${CLASSIFIER_FALLBACK_TIER:-low}
      CLASSIFIER_MAX_TOKENS: ${CLASSIFIER_MAX_TOKENS:-64}
      CLASSIFIER_MAX_INPUT_CHARS: ${CLASSIFIER_MAX_INPUT_CHARS:-32000}
    volumes:
      - catalog-data:/catalog:ro
    restart: unless-stopped
  catalog-sync:
    image: ${CATALOG_IMAGE:-ghcr.io/lsk242/pennyrouter-catalog:latest}
    volumes:
      - catalog-data:/catalog
    environment:
      SYNC_INTERVAL: ${SYNC_INTERVAL:-3600}
      FETCH_OPENROUTER: ${FETCH_OPENROUTER:-0}
      EXTRA_MODEL_IDS: ${EXTRA_MODEL_IDS:-}
    restart: unless-stopped

volumes:
  catalog-data:
