# Local development: builds the image from source and runs it.
# Usage (from the repo root):
#   make dev   # = docker compose --env-file .env.dev [--env-file .env] up --build
# Same config split as compose.dev.yaml: generic values from the
# committed .env.dev via `env_file:`, secrets + custom URLs from the
# gitignored .env overlay via `environment:` (optional — fail-closed
# defaults apply without it). Local differences: images build from
# source, ports publish to the host (no reverse proxy on a laptop),
# and catalog-sync mounts the fixture input dir.
# The catalog-sync service writes versioned DB artifacts to the shared
# catalog-data volume, which the gateway mounts read-only.
services:
  gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: ${IMAGE:-pennyrouter:dev}
    container_name: gateway
    ports:
      - "${HOST_PORT:-3000}:${PORT:-8080}"
    # Lets the container reach host-run mocks (perf comparison) via
    # http://host.docker.internal:<port>. Harmless for normal dev.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env.dev
    environment:
      # Secrets + custom URLs only (generic config arrives via
      # env_file above), interpolated from .env.dev + .env.
      MODAL_BASE_URL: ${MODAL_BASE_URL:-}
      MODAL_MODELS: ${MODAL_MODELS:-}
      BASETEN_MODELS: ${BASETEN_MODELS:-}
    volumes:
      - catalog-data:/catalog:ro
  catalog-sync:
    build:
      context: .
      dockerfile: docker/Dockerfile.catalog
    image: ${CATALOG_IMAGE:-pennyrouter-catalog:dev}
    volumes:
      - catalog-data:/catalog
      # Fixture input until live fetching lands.
      - ./crates/catalog/tests/fixtures:/input:ro
    env_file:
      - .env.dev
    environment:
      # Secrets only (generic config arrives via env_file above):
      # judge backends + popularity-pins Data API key.
      BASETEN_API_KEY: ${BASETEN_API_KEY:-}
      MODAL_KEY_ID: ${MODAL_KEY_ID:-}
      MODAL_KEY_SECRET: ${MODAL_KEY_SECRET:-}
      MODAL_JUDGE_URL: ${MODAL_JUDGE_URL:-}
      RANKINGS_API_KEY: ${RANKINGS_API_KEY:-}
    restart: unless-stopped
  # Opt-in catalog browser (Iter 17): only starts with
  #   docker compose --profile ui up catalog-ui
  # then open http://localhost:${CATALOG_UI_PORT:-8080} in a browser.
  catalog-ui:
    profiles: ["ui"]
    build:
      context: .
      dockerfile: docker/Dockerfile.catalog
    image: ${CATALOG_IMAGE:-pennyrouter-catalog:dev}
    command: ["catalog-ui", "--dir", "/catalog", "--bind", "0.0.0.0"]
    ports:
      - "${CATALOG_UI_PORT:-8080}:8080"
    volumes:
      - catalog-data:/catalog:ro
    environment:
      CATALOG_UI: "1"
      PORT: "8080"

volumes:
  catalog-data:
