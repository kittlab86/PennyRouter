name: Docker

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build and smoke test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Image names (lowercase)
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:latest" >> "$GITHUB_ENV"
          echo "CATALOG_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-catalog:latest" >> "$GITHUB_ENV"
      - name: Validate the deploy compose is pull-only
        run: |
          docker compose -f compose.dev.yaml config --quiet
          if docker compose -f compose.dev.yaml config | grep -q 'build:'; then
            echo "compose.dev.yaml must not contain a build section" >&2
            exit 1
          fi
      - uses: docker/setup-buildx-action@v4
      - if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          load: true
          push: false
          tags: ${{ env.IMAGE }}
      - name: Smoke test /health
        run: |
          docker run -d --name gw -p 8080:8080 "${IMAGE}"
          sleep 2
          curl -fsS http://localhost:8080/health
          docker stop gw
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.catalog
          load: true
          push: false
          tags: ${{ env.CATALOG_IMAGE }}
      - name: Smoke test catalog one-shot
        run: |
          docker volume create catalog-ci
          docker run --rm -v catalog-ci:/catalog "${CATALOG_IMAGE}"
          docker run --rm -v catalog-ci:/catalog:ro debian:bookworm-slim \
            sh -c 'ls /catalog/*.manifest.json'
      - name: Push images
        if: github.event_name == 'push'
        run: |
          docker push "${IMAGE}"
          docker push "${CATALOG_IMAGE}"
